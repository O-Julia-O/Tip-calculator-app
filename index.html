<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
  <title>Tip Calculator App</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="./css/style.css" />
  <script defer src="./js/script.js"></script>
</head>

<body>
  <main class="calculator">
    <div class="calculator__container">
      
      <!-- Left section -->
      <section class="calculator__inputs">
        <!-- Bill input -->
        <div class="field">
          <label for="bill" class="field__label">Bill</label>
          <input id="bill" type="number" name="bill" class="field__input" placeholder="0" autocomplete="off" min="0" />
        </div>

        <!-- Tip buttons -->
        <div class="field">
          <label class="field__label">Select Tip %</label>
          <div class="tip-grid">
            <button class="tip-btn" data-tip="5">5%</button>
            <button class="tip-btn" data-tip="10">10%</button>
            <button class="tip-btn" data-tip="15">15%</button>
            <button class="tip-btn" data-tip="20">25%</button>
            <button class="tip-btn" data-tip="25">50%</button>
            <input type="number" class="tip-btn tip-btn--custom" placeholder="Custom" min="0" max="100" />
          </div>
        </div>

        <!-- People input -->
        <div class="field">
          <label for="people" class="field__label">Number of People</label>
          <input id="people" type="number" name="people" class="field__input" placeholder="1" min="1" max="25" value="1" />
        </div>
      </section>

      <!-- Right section -->
      <section class="calculator__results">
        <div class="results__group">
          <div class="results__item">
            <div>
              <p class="results__label">Tip Amount <span>/ person</span></p>
            </div>
            <p class="results__value" id="tipAmount">$0.00</p>
          </div>

          <div class="results__item">
            <div>
              <p class="results__label">Total <span>/ person</span></p>
            </div>
            <p class="results__value" id="displayedAmount">$0.00</p>
          </div>
        </div>

        <button id="reset-btn" class="results__reset-btn">Reset</button>
      </section>

    </div>
  </main>
</body>
</html>
