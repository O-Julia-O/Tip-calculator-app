<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Tip calculator app</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./js/script.js"></script>
  </head>
  <body>
    <main>
      <article>
        <section>
          <label for="bill">Bill</label>
          <input id="bill" type="number" name="bill" />

          <label for="tip">Select Tip %</label>
          <button id="tip" class="tip" data-tip="5">5%</button>
          <button id="tip" class="tip" data-tip="10">10%</button>
          <button id="tip" class="tip" data-tip="15">15%</button>
          <button id="tip" class="tip" data-tip="20">25%</button>
          <button id="tip" class="tip" data-tip="25">50%</button>
          <button>Custom</button>

          <label for="people">Number of People</label>
          <input
            name="people"
            type="number"
            id="people"
            
          />
        </section>

        <section>
          <p>Tip Amount</p>
          <p>/ person</p>
          <p id="tipAmount">0.00</p>
          <!-- <div class="result" id="output"></div> -->
          <p>Total</p>
          <p>/ person</p>
          <p id="displayedAmount">0.00</p>

          <button id="reset-btn">Reset</button>
        </section>
      </article>
    </main>
  </body>
</html>
